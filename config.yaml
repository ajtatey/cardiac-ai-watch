# Cardiac AI Watch configuration.
# Everything the collectors and triage need to know about the field lives here.

topic: >
  AI and software for cardiac imaging: coronary CT angiography (CCTA) plaque
  quantification and characterization, FFR-CT and other CT-derived physiology,
  AI-QCT, coronary calcium scoring (including opportunistic CAC on non-gated CT),
  pericoronary / perivascular fat inflammation imaging, cardiac MRI analysis,
  AI echocardiography, nuclear cardiology AI, structural heart planning
  software, and the regulatory, reimbursement, clinical-evidence and business
  landscape around those products.

email:
  from: "Cardiac AI Watch <cardiac-ai-watch@updates.argot.dev>"
  to: ["andrew@argot.dev"]
  brief_subject_prefix: "Cardiac AI brief"
  alert_subject_prefix: "ALERT"

# Companies we track by name. `aliases` are matched case-insensitively in text.
# `fda_applicant` is used for an openFDA applicant search (omit for big vendors
# whose applicant search would be too broad; product codes catch them).
companies:
  - slug: cleerly
    name: Cleerly
    aliases: [Cleerly, "Cleerly Labs", "Cleerly ISCHEMIA", "Cleerly Plaque"]
    fda_applicant: cleerly
    is_us: true
  - slug: heartflow
    name: HeartFlow
    aliases: [HeartFlow, Heartflow, FFRct, "FFR-CT", "HeartFlow Plaque Analysis", HTFL]
    fda_applicant: heartflow
    edgar_cik: "0001464521"
  - slug: elucid
    name: Elucid Bioimaging
