    fda_applicant: circle cardiovascular
  - slug: keya-medical
    name: Keya Medical
    aliases: [Keya Medical, DEEPVESSEL, "Keya"]
    fda_applicant: keya medical
  - slug: us2ai
    name: Us2.ai
    aliases: ["Us2.ai", "Us2.v", "Us2.ca"]
    fda_applicant: us2.ai
  - slug: ultromics
